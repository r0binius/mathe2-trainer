[package]
name = "mouseless"
version = "0.1.0"
description = "Keyboard shortcut training and look-up."
edition = "2024"
publish = false

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"

[lints.rust]
# FFI code (macOS APIs) opts in per module with `#[allow(unsafe_code)]` and a SAFETY comment.
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "deny"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
