[package]
name = "mouseless"
version = "0.1.0"
description = "Keyboard shortcut training and look-up."
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
thiserror = "2.0.21"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "libc",
  "NSRunningApplication",
  "NSWorkspace",
] }
objc2-application-services = { version = "0.3.2", default-features = false, features = [
  "std",
  "AXUIElement",
  "HIServices",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFArray",
  "CFBase",
  "CFData",
  "CFDictionary",
  "CFMachPort",
  "CFNotificationCenter",
  "CFNumber",
  "CFRunLoop",
  "CFString",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSLocale",
  "NSString",
  "NSURL",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
  "std",
  "CGEvent",
  "CGEventTypes",
  "CGWindow",
] }

[lints.rust]
missing_docs = "warn"
# FFI code (macOS APIs) opts in per module with `#![expect(unsafe_code)]`, and every block with a SAFETY comment.
unsafe_code = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
excessive_nesting = "warn"
expect_used = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "deny"
# Runtime failures, which High Assurance Rust says to minimize: overflow, out-of-bounds, lossy casts.
arithmetic_side_effects = "warn"
as_conversions = "warn"
indexing_slicing = "warn"
# Each unsafe operation stands alone with its own SAFETY comment.
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
# Every lint exception says why.
allow_attributes_without_reason = "warn"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
